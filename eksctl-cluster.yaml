apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ha-devops-eks
  region: ap-south-1

vpc:
  id: vpc-01f2eb8cd2ae0ac2c
  subnets:
    private:
      ap-south-1a:
        id: subnet-09b6f462f6293bd5b
      ap-south-1b:
        id: subnet-0aecd88b09d89ebfa

managedNodeGroups:
